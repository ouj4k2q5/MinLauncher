name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Releases are not cancelled mid-flight: a half-finished run could leave a GitHub
# Release without its APK attached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Adding required reviewers to this environment turns a tag push into a manual
    # approval gate. The environment is created on first use if it does not exist.
    environment: release

    permissions:
      contents: write          # create the GitHub Release
      id-token: write          # actions/attest requests a Sigstore signing certificate
      attestations: write      # actions/attest persists the attestation
      artifact-metadata: write # actions/attest records artifact storage metadata

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        env:
          # Read through env rather than interpolating into the script: a tag name is
          # attacker-controllable in a fork and would otherwise be shell-injected.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like vMAJOR.MINOR.PATCH, got '$TAG'"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must stay below 100 to keep versionCode monotonic"
            exit 1
          fi
          version_code=$(( major * 10000 + minor * 100 + patch ))
          
          # version.properties is bumped by hand on the release branch before the
          # tag is pushed, and is what a plain `gradle assembleRelease` (as F-Droid's
          # build server runs it, with no -P properties) resolves the version from.
          # Asserting it matches the tag here catches a tag pushed outside the
          # release procedure.
          read -r committed_name committed_code < <(awk -F= '
            $1 == "versionName" { n = $2 }
            $1 == "versionCode" { c = $2 }
            END { print n, c }
          ' version.properties)
          if [[ "$committed_name" != "$version" || "$committed_code" != "$version_code" ]]; then
            echo "::error::version.properties ($committed_name/$committed_code) does not match tag $TAG ($version/$version_code); follow the release procedure in docs/releasing.md"
            exit 1
          fi
          
          {
            echo "VERSION_NAME=$version"
            echo "APK_NAME=MinLauncher-$version.apk"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # A tag is not the default branch, so nothing should be written to the cache
          # from here.
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [[ ! -s "$RUNNER_TEMP/release.jks" ]]; then
            echo "::error::decoded keystore is empty; is KEYSTORE_BASE64 valid base64?"
            exit 1
          fi

      - name: Test, lint and build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Tests and lint run here too: a tag can point at a commit that never went
        # through CI.
        # No -PappVersionName/-PappVersionCode here: version.properties, already
        # verified against the tag above, is what build.gradle.kts falls back to. This
        # is the same plain `gradle assembleRelease` F-Droid's build server runs.
        run: |
          set -euo pipefail
          ./gradlew --stacktrace test lint assembleRelease

      - name: Verify signature
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$apk" ]]; then
            echo "::error::expected a signed APK at $apk; an unsigned build means the signing config did not apply"
            exit 1
          fi
          "$apksigner" verify --print-certs --verbose "$apk"
          mv "$apk" "$APK_NAME"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.APK_NAME }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$APK_NAME" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

      - name: Upload R8 mapping
        # Needed to retrace stack traces from this build. Lost with the runner otherwise.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-mapping-${{ env.VERSION_NAME }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
