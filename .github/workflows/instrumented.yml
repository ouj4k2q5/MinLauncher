name: Instrumented tests

# The emulator-based smoke tests are too slow for the per-push CI loop
# (ci.yml); run them nightly and on demand instead.
on:
  schedule:
    - cron: '30 19 * * *' # 04:30 JST daily
  workflow_dispatch:

# Least privilege by default. This workflow only needs to read the repository.
permissions:
  contents: read

# Supersede an in-flight nightly run if one is still going.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Smoke tests on Gradle Managed Device
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          # No `cache: gradle` here: setup-gradle below owns the Gradle User Home cache
          # and the two interfere with each other.

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        # Wrapper validation is built in. The Gradle User Home cache carries the
        # wrapper and dependencies between runs; the aosp-atd system image installs
        # into $ANDROID_HOME, which is not cached, so every run re-downloads it.

      # The runner image pre-accepts licenses only for the SDK components it
      # preinstalls (emulator, platform-tools, ...). The aosp-atd system image is
      # not among them, so AGP's automatic SDK install in pixel2api30Setup fails
      # with LicenceNotAcceptedException unless they are accepted here first.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # /dev/kvm exists on GitHub-hosted Linux runners (public repos) but is
      # root:kvm 0660, and the runner user is not in the kvm group
      # (actions/runner-images#8542), so the emulator cannot open it and fails
      # with "x86 emulation currently requires hardware acceleration!". Open
      # the device to all users via a udev rule — the standard workaround from
      # the android-emulator-runner docs.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # swiftshader_indirect pins the software GPU, per the managed-devices
      # docs for CI hosts without a GPU.
      - name: Run instrumented smoke tests
        run: ./gradlew --stacktrace pixel2api30DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
