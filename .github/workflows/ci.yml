name: CI

# A push that creates a tag carries no branch, so a branch filter alone already keeps
# tag pushes out of this workflow — those are handled by release.yml.
on:
  push:
    branches: ['**']
  pull_request:

# Least privilege by default. This workflow only needs to read the repository.
permissions:
  contents: read

# Supersede an in-flight run when new commits arrive on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level so only this job gets the extra scope the coverage comment
    # needs; every other permission stays at the workflow's contents: read.
    # Note: job-level permissions replace the workflow-level block entirely,
    # hence the explicit contents: read here as well.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: detekt baseline must not grow
        # The baseline is a ratchet (see docs/development.md): it may shrink but
        # never grow. config/detekt/baseline-max holds the allowed entry count.
        run: |
          COUNT=$(grep -c '<ID>' app/detekt-baseline.xml)
          MAX=$(grep -m1 -oE '[0-9]+' config/detekt/baseline-max)
          echo "detekt baseline entries: $COUNT (allowed: $MAX)"
          if [ "$COUNT" -gt "$MAX" ]; then
          echo "::error::detekt baseline grew ($MAX -> $COUNT). Fix the new violations instead of baselining them, or raise config/detekt/baseline-max in this commit so the change gets reviewed."
          exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          # No `cache: gradle` here: setup-gradle below owns the Gradle User Home cache
          # and the two interfere with each other.

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        # Wrapper validation is built in, so no separate wrapper-validation step is
        # needed. Caching is on by default and only writes from the default branch.

      - name: Test, lint and build
        # assembleRelease is included so R8 runs on every push. Shrinking problems only
        # surface in the release build, and release.yml depends on it succeeding.
        # ktlintCheck and detekt enforce the Kotlin code style (.editorconfig) and
        # static analysis (config/detekt) on top of the built-in Android lint.
        # verifyRoborazziDebug fails when a screenshot no longer matches the committed
        # baseline in app/roborazzi (plain `test` silently skips the capture).
        # createDebugUnitTestCoverageReport generates the JaCoCo HTML/XML report
        # (report only, no threshold gate); it lands in app/build/reports/coverage/,
        # which the artifact upload below already includes.
        # --continue so a failing task (e.g. test) doesn't hide later failures in
        # detekt/ktlintCheck; reports are uploaded either way via if: always().
        run: ./gradlew --stacktrace --continue test verifyRoborazziDebug createDebugUnitTestCoverageReport lint detekt ktlintCheck assembleDebug assembleRelease

      - name: Post coverage report
        # Parses the JaCoCo XML from the step above and posts the coverage
        # table as a PR comment (updated on every push while the PR is open)
        # and to this job's summary, so branches without a PR still show it.
        # The action's continue-on-error default is true: a missing report
        # (e.g. nothing built) logs a warning but doesn't fail the run.
        # min-coverage-* only toggles the pass/fail emoji in the table, and
        # is zeroed to match the deliberate no-threshold-gate policy.
        # Fork PRs get a read-only GITHUB_TOKEN, so the comment is skipped
        # there; the job summary still renders.
        if: always()
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/app/build/reports/coverage/test/debug/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '## Unit test coverage'
          comment-type: both
          update-comment: true
          min-coverage-overall: 0
          min-coverage-changed-files: 0

      - name: Upload reports
        # Reports are most useful precisely when the build failed.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          # app/build/intermediates/roborazzi/ holds the *_actual.png / *_compare.png
          # diff images that verifyRoborazziDebug produces when a screenshot no
          # longer matches its baseline.
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/intermediates/roborazzi/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
