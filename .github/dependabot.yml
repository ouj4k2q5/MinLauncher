version: 2

updates:
  # Actions are pinned to commit SHAs, which cannot be moved. The cost is that security
  # fixes no longer arrive by themselves, so Dependabot is what keeps the pins current -
  # it bumps both the SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Kotlin compiler is not a declared dependency in this repo: it comes
    # from AGP's built-in Kotlin support (AGP 9.5.x embeds Kotlin 2.2.10 via its
    # kotlin-gradle-plugin runtime dependency). Bumping org.jetbrains.kotlin
    # artifacts (stdlib, plugin.compose) past the embedded compiler breaks
    # every compile task: "module was compiled with an incompatible version of
    # Kotlin. The binary version of its metadata is 2.4.0, expected version is
    # 2.2.0." kotlinx-* (coroutines) is independent of that pin, so it stays
    # updatable. When AGP is updated, check which Kotlin it embeds and raise
    # this ceiling to match before letting these updates through again.
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        versions: ["> 2.2.10"]
    groups:
      # AndroidX artifacts share a release train, so bumping them one PR at a time both
      # creates noise and risks mismatched versions inside a single group.
      androidx:
        patterns:
          - 'androidx.*'
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'org.jetbrains.kotlinx*'
