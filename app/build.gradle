apply plugin: 'com.android.application'

// Version is injected by the release workflow, which derives it from the git tag:
//   tag v1.2.3 -> appVersionName=1.2.3, appVersionCode=10203 (major*10000 + minor*100 + patch)
// The defaults keep local builds working without passing anything.
def appVersionName = (project.findProperty('appVersionName') ?: '1.0.0').toString()
def appVersionCode = (project.findProperty('appVersionCode') ?: '10000').toString().toInteger()

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "io.github.ouj4k2q5.minlauncher"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode appVersionCode
        versionName appVersionName

        resourceConfigurations += ["en", "ar", "de", "es-rES", "es-rUS", "fr", "he", "hr", "hu", "in", "it", "ja", "ko", "nl", "pl", "pt-rBR", "ru-rRU", "sv", "tr", "uk", "zh"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Credentials come from the environment rather than being written here, so nothing
    // secret ends up in the repository. The release workflow decodes the keystore from a
    // secret and points KEYSTORE_PATH at it. Passing them as environment variables rather
    // than -P properties also keeps them out of the process list.
    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without a keystore the APK is left unsigned, so assembleRelease still works
            // for anyone building from source.
            if (System.getenv('KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    namespace = 'app.minlauncher'
}

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.android
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    testImplementation libs.junit
}
